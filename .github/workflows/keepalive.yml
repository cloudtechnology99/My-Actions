name: keepalive

on:
  schedule:
    # 每周一 03:17 UTC 检查一次，防止公开仓库 60 天无活动导致 scheduled workflow 被自动禁用
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略 45 天阈值，立即创建保活提交'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Create activity commit when due
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          THRESHOLD_DAYS: '45'
        run: |
          set -euo pipefail

          last_ts=$(git log -1 --format=%ct)
          now_ts=$(date -u +%s)
          age_days=$(( (now_ts - last_ts) / 86400 ))

          echo "Last commit age: ${age_days} days"

          if [ "${FORCE}" != "true" ] && [ "${age_days}" -lt "${THRESHOLD_DAYS}" ]; then
            echo "Recent activity exists; skip."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(keepalive): $(date -u +%Y-%m-%d) [skip ci]"
          git push
